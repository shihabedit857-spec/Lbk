<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <title>TEAM 84FF | FreeFire Level Up Bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* একদম ডার্ক প্রিমিয়াম থিম */
            --bg-main: #0d0d0d;
            --bg-card: #161616;
            --bg-card-hover: #1c1c1c;
            --bg-input: #1a1a1a;
            --bg-modal: #141414;
            
            --border-light: rgba(255, 255, 255, 0.07);
            --border-focus: rgba(255, 87, 34, 0.5);
            
            /* মেইন ওরেঞ্জ-রেড গ্রেডিয়েন্ট */
            --gradient-primary: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            --gradient-orange: linear-gradient(135deg, #ff6b00 0%, #ff8c00 100%);
            
            --accent-orange: #ff5722;
            --accent-red: #ff416c;
            --accent-green: #22c55e;
            
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            
            --shadow-glow: 0 4px 20px rgba(255, 75, 43, 0.3);
            
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { width: 100%; overflow-x: hidden; }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            padding: 12px;
            padding-top: calc(12px + var(--safe-top));
            padding-bottom: calc(12px + var(--safe-bottom));
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1440px; margin: 0 auto; width: 100%; }

        /* ==================== HEADER ==================== */
        header {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 18px;
            margin-bottom: 12px;
        }

        .brand { display: flex; align-items: center; gap: 12px; }

        .logo-box {
            width: 46px;
            height: 46px;
            min-width: 46px;
            background: var(--gradient-primary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: var(--shadow-glow);
            position: relative;
        }

        .brand-text h1 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: #fff;
            line-height: 1.2;
        }

        .brand-text h1 span {
            font-weight: 400;
            color: var(--text-secondary);
            font-size: 0.75em;
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .live-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: var(--accent-green);
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: blink 1.3s infinite;
            flex-shrink: 0;
            box-shadow: 0 0 8px var(--accent-green);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.75); }
        }

        .header-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* ==================== BUTTONS ==================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            user-select: none;
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease, opacity 0.18s ease, background 0.18s ease;
            will-change: transform;
            white-space: nowrap;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .btn:active:not(:disabled) { transform: scale(0.96); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-primary {
            background: var(--gradient-primary);
            color: #fff;
            box-shadow: var(--shadow-glow);
        }

        .btn-ghost {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }
        .btn-ghost:hover:not(:disabled) {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* ==================== STATS GRID ==================== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: border-color 0.3s ease;
        }

        .stat-card:active { border-color: rgba(255, 255, 255, 0.15); }

        .stat-icon {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            background: rgba(255, 75, 43, 0.1);
            color: var(--accent-orange);
            border: 1px solid rgba(255, 75, 43, 0.15);
        }

        .stat-content { min-width: 0; flex: 1; overflow: hidden; }

        .stat-content h3 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: #fff;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-content p {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ==================== MAIN CARD ==================== */
        .card-box {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 18px;
            padding: 16px;
        }

        .box-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 8px;
        }

        .box-title {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .box-title i {
            color: var(--accent-orange);
            font-size: 15px;
        }

        .accounts-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ==================== ACCOUNT CARD ==================== */
        .account-card {
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 16px;
            transition: border-color 0.3s ease;
        }

        .acc-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 14px;
        }

        .acc-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .acc-avatar {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            color: var(--accent-orange);
            border: 1px solid rgba(255, 75, 43, 0.25);
        }

        .acc-info { min-width: 0; flex: 1; }

        .acc-info h4 {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            line-height: 1.2;
        }

        .region-badge {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .acc-info span {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            display: block;
            margin-top: 4px;
            word-break: break-all;
            letter-spacing: 0.3px;
        }

        .acc-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            white-space: nowrap;
            flex-shrink: 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-online {
            background: rgba(34, 197, 94, 0.08);
            color: var(--accent-green);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .status-match {
            background: rgba(255, 75, 43, 0.12);
            color: var(--accent-orange);
            border: 1px solid rgba(255, 75, 43, 0.4);
            animation: pulse-border 1.5s infinite alternate;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(255, 75, 43, 0.3); }
            100% { border-color: rgba(255, 75, 43, 0.8); }
        }

        /* ==================== EXP BOX ==================== */
        .exp-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .exp-item { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

        .exp-label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        .exp-val {
            font-size: 14px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.3px;
        }

        .exp-item.full-width { grid-column: span 2; }

        .gained-badge {
            background: rgba(255, 75, 43, 0.15);
            color: var(--accent-orange);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid rgba(255, 75, 43, 0.3);
            letter-spacing: -0.3px;
        }

        /* ==================== PROGRESS ==================== */
        .level-progress { margin-bottom: 12px; }

        .level-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 8px;
            font-weight: 700;
            gap: 8px;
        }

        .level-labels .lvl { color: var(--accent-orange); }
        .level-labels .matches { color: var(--text-secondary); }

        .progress-bar-bg {
            height: 5px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--gradient-primary);
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
            box-shadow: 0 0 10px rgba(255, 75, 43, 0.5);
        }

        /* ==================== ACTIONS ==================== */
        .acc-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px;
            color: var(--text-muted);
            gap: 8px;
        }

        .acc-actions > span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .action-btns { display: flex; gap: 8px; flex-shrink: 0; }

        .icon-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            width: 34px;
            height: 34px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 12px;
        }

        .icon-btn:active {
            background: rgba(255, 75, 43, 0.15);
            color: var(--accent-orange);
            border-color: rgba(255, 75, 43, 0.3);
            transform: scale(0.93);
        }

        .icon-btn.danger:active {
            background: rgba(220, 38, 38, 0.15);
            color: #f87171;
            border-color: rgba(220, 38, 38, 0.4);
        }

        /* ==================== MODAL ==================== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
            padding-bottom: var(--safe-bottom);
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: var(--bg-modal);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: none;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            padding-bottom: calc(24px + var(--safe-bottom));
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
            max-height: 92vh;
            overflow-y: auto;
            animation: slideUp 0.32s cubic-bezier(0.34, 1.3, 0.64, 1);
        }

        .modal-card::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0.5; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            margin-bottom: 20px;
            gap: 8px;
        }

        .modal-header h3 {
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-header h3 i { color: var(--accent-orange); }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        .form-input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px rgba(255, 75, 43, 0.1);
        }

        .form-input::placeholder { color: var(--text-muted); }

        select.form-input {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px;
        }

        textarea.form-input { resize: vertical; min-height: 80px; }

        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 40px;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.1);
        }

        .empty-state p { font-size: 13px; }

        /* ==================== TABLET & DESKTOP ==================== */
        @media (min-width: 640px) {
            body { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
            .stat-content h3 { font-size: 22px; }
            .stat-content p { font-size: 11px; }
            header { flex-direction: row; align-items: center; padding: 20px 24px; }
            .header-actions { grid-template-columns: auto auto; }
            .modal-overlay { align-items: center; }
            .modal-card { border-radius: 24px; padding: 28px; margin: 16px; }
            .modal-card::before { display: none; }
        }

        @media (min-width: 1024px) {
            body { padding: 24px; }
            header { padding: 24px 32px; border-radius: 20px; margin-bottom: 24px; }
            .brand-text h1 { font-size: 22px; }
            .brand-text p { font-size: 13px; }
            .logo-box { width: 52px; height: 52px; min-width: 52px; font-size: 24px; border-radius: 16px; }
            .stats-grid { gap: 20px; margin-bottom: 24px; }
            .stat-card { padding: 22px; gap: 18px; border-radius: 18px; }
            .stat-icon { width: 54px; height: 54px; min-width: 54px; font-size: 22px; border-radius: 15px; }
            .stat-content h3 { font-size: 28px; }
            .stat-content p { font-size: 13px; }
            .card-box { padding: 28px; border-radius: 20px; }
            .box-title { font-size: 18px; }
            .accounts-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
            .account-card { padding: 24px; border-radius: 18px; }
            .acc-avatar { width: 48px; height: 48px; min-width: 48px; font-size: 18px; border-radius: 14px; }
            .acc-info h4 { font-size: 17px; }
            .acc-info span { font-size: 13px; }
            .acc-status { font-size: 11px; padding: 6px 14px; }
            .exp-box { grid-template-columns: 1fr 1fr 1fr; padding: 16px 20px; gap: 16px; }
            .exp-label { font-size: 10px; }
            .exp-val { font-size: 18px; }
            .level-labels { font-size: 13px; }
            .acc-actions { font-size: 13px; }
            .icon-btn { width: 38px; height: 38px; border-radius: 11px; font-size: 14px; }
            .btn { padding: 14px 24px; border-radius: 14px; font-size: 14px; }
        }

        @media (hover: none) {
            .btn:hover { transform: none; }
            .stat-card:hover { transform: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">
                <div class="logo-box">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div class="brand-text">
                    <h1>TEAM 84FF <span>| LEVEL UP BOT</span></h1>
                    <p>
                        <span class="live-tag"><span class="pulse-dot"></span> Online</span>
                        <span>Safe Multi-Match Engine</span>
                    </p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-ghost" onclick="fetchStats(true)"><i class="fa-solid fa-rotate"></i> Refresh</button>
                <button class="btn btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Add Account</button>
            </div>
        </header>

        <!-- Stats Bar -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-accounts">0</h3>
                    <p>Accounts</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-angles-up"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-exp">+0</h3>
                    <p>EXP Gained</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-gamepad"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-matches">0</h3>
                    <p>Matches</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="stat-content">
                    <h3 id="stat-uptime">00:00:00</h3>
                    <p>Uptime</p>
                </div>
            </div>
        </div>

        <!-- Accounts -->
        <div class="card-box">
            <div class="box-header">
                <div class="box-title">
                    <i class="fa-solid fa-user-astronaut"></i>
                    <span>Live Accounts & EXP</span>
                </div>
            </div>
            <div class="accounts-list" id="accounts-container">
                <div class="empty-state">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <p>Loading accounts...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Account Modal -->
    <div class="modal-overlay" id="add-modal" onclick="if(event.target===this)closeAddModal()">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-user-plus"></i> Add New Account</h3>
                <button class="icon-btn" onclick="closeAddModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="add-acc-form" onsubmit="submitAddAccount(event)">
                <div class="form-group">
                    <label>Account Type</label>
                    <select class="form-input" id="acc-type" onchange="toggleFormType()">
                        <option value="guest">Guest Account (UID + Password)</option>
                        <option value="token">Access Token</option>
                    </select>
                </div>
                <div id="guest-fields">
                    <div class="form-group">
                        <label>Guest UID</label>
                        <input type="text" class="form-input" id="acc-uid" placeholder="Enter player UID" inputmode="numeric" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>Guest Password / Secret</label>
                        <input type="text" class="form-input" id="acc-password" placeholder="Enter password" autocomplete="off">
                    </div>
                </div>
                <div id="token-fields" style="display:none;">
                    <div class="form-group">
                        <label>Access Token</label>
                        <textarea class="form-input" id="acc-token" rows="3" placeholder="Paste access token here..." autocomplete="off"></textarea>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:24px;">
                    <button type="button" class="btn btn-ghost" onclick="closeAddModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Save & Start</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let serverUptimeBase = 0;
        let localStartTime = Date.now();
        let pollTimer = null;
        let isFetching = false;
        let lastDataHash = '';

        function openAddModal() {
            document.getElementById('add-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeAddModal() {
            document.getElementById('add-modal').classList.remove('active');
            document.body.style.overflow = '';
        }
        function toggleFormType() {
            const type = document.getElementById('acc-type').value;
            document.getElementById('guest-fields').style.display = type === 'guest' ? 'block' : 'none';
            document.getElementById('token-fields').style.display = type === 'token' ? 'block' : 'none';
        }

        async function submitAddAccount(e) {
            e.preventDefault();
            const type = document.getElementById('acc-type').value;
            let payload = {};
            if (type === 'guest') {
                const uid = document.getElementById('acc-uid').value.trim();
                const password = document.getElementById('acc-password').value.trim();
                if (!uid || !password) return alert('Please enter both UID and Password');
                payload = { uid, password };
            } else {
                const token = document.getElementById('acc-token').value.trim();
                if (!token) return alert('Please enter token');
                payload = { token };
            }
            try {
                const res = await fetch('/api/account/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    closeAddModal();
                    document.getElementById('add-acc-form').reset();
                    fetchStats(true);
                } else {
                    alert('Error: ' + (data.error || 'Unknown'));
                }
            } catch (err) { alert('Request failed: ' + err); }
        }

        async function deleteAccount(uid) {
            if (!confirm('Remove account ' + uid + '?')) return;
            try {
                await fetch('/api/account/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid })
                });
                fetchStats(true);
            } catch (err) { console.error(err); }
        }

        async function refreshAccountInfo(uid) {
            try {
                await fetch('/api/account/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid })
                });
                fetchStats(true);
            } catch (err) { console.error(err); }
        }

        function renderAccounts(accounts) {
            const container = document.getElementById('accounts-container');
            if (!accounts.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-ghost"></i>
                        <p>No active accounts. Tap "+ Add" to start!</p>
                    </div>`;
                return;
            }
            container.innerHTML = accounts.map(acc => {
                const gainedExp = acc.gained_exp || 0;
                const isMatch = acc.status === 'IN_MATCH';
                const statusClass = isMatch ? 'status-match' : 'status-online';
                const statusText = isMatch ? `In Match (${acc.active_matches || 0})` : (acc.status || 'ONLINE');
                const progressPct = Math.min(100, Math.max(5, (acc.current_exp % 1000) / 10));

                return `
                    <div class="account-card">
                        <div class="acc-top">
                            <div class="acc-profile">
                                <div class="acc-avatar"><i class="fa-solid fa-user"></i></div>
                                <div class="acc-info">
                                    <h4>${escapeHtml(acc.nickname || 'Player')} <span class="region-badge">${escapeHtml(acc.region || 'BD')}</span></h4>
                                    <span>UID: ${escapeHtml(acc.uid)}</span>
                                </div>
                            </div>
                            <div class="acc-status ${statusClass}">
                                <span class="pulse-dot"></span>
                                <span>${statusText}</span>
                            </div>
                        </div>

                        <div class="exp-box">
                            <div class="exp-item">
                                <span class="exp-label">Initial</span>
                                <span class="exp-val">${Number(acc.initial_exp || 0).toLocaleString()}</span>
                            </div>
                            <div class="exp-item">
                                <span class="exp-label">Current</span>
                                <span class="exp-val">${Number(acc.current_exp || 0).toLocaleString()}</span>
                            </div>
                            <div class="exp-item full-width">
                                <span class="exp-label">EXP Gained</span>
                                <span class="gained-badge">+${Number(gainedExp).toLocaleString()} EXP</span>
                            </div>
                        </div>

                        <div class="level-progress">
                            <div class="level-labels">
                                <span class="lvl">Level ${acc.level || 1}</span>
                                <span class="matches">Matches: ${acc.matches_played || 0}</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${progressPct}%"></div>
                            </div>
                        </div>

                        <div class="acc-actions">
                            <span>Last: ${acc.last_match_time || 'Running...'}</span>
                            <div class="action-btns">
                                <button class="icon-btn" title="Refresh" onclick="refreshAccountInfo('${escapeHtml(acc.uid)}')"><i class="fa-solid fa-rotate"></i></button>
                                <button class="icon-btn danger" title="Delete" onclick="deleteAccount('${escapeHtml(acc.uid)}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function fetchStats(force = false) {
            if (isFetching && !force) return;
            isFetching = true;
            try {
                const res = await fetch('/api/stats', { cache: 'no-store' });
                const data = await res.json();

                const hash = JSON.stringify({
                    a: data.accounts.map(a => [a.uid, a.current_exp, a.gained_exp, a.status, a.matches_played, a.level]),
                    m: data.total_matches,
                    e: data.total_gained_exp
                });

                document.getElementById('stat-total-accounts').innerText = data.total_accounts;
                document.getElementById('stat-total-exp').innerText = '+' + Number(data.total_gained_exp).toLocaleString();
                document.getElementById('stat-total-matches').innerText = data.total_matches;

                if (data.uptime !== undefined) {
                    serverUptimeBase = data.uptime;
                    localStartTime = Date.now();
                }

                if (force || hash !== lastDataHash) {
                    lastDataHash = hash;
                    renderAccounts(data.accounts || []);
                }
            } catch (err) { console.error("Fetch failed:", err); }
            finally { isFetching = false; }
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function updateUptime() {
            const sec = serverUptimeBase + Math.floor((Date.now() - localStartTime) / 1000);
            const h = String(Math.floor(sec / 3600)).padStart(2, '0');
            const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            document.getElementById('stat-uptime').innerText = `${h}:${m}:${s}`;
        }

        const POLL_INTERVAL = 800;

        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(() => {
                if (!document.hidden) fetchStats(false);
            }, POLL_INTERVAL);
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (pollTimer) clearInterval(pollTimer);
                pollTimer = null;
            } else {
                fetchStats(true);
                startPolling();
            }
        });

        updateUptime();
        setInterval(updateUptime, 1000);
        fetchStats(true);
        startPolling();

        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, { passive: false });
    </script>
</body>
</html>
